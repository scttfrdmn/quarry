name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          check-latest: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./... -count=1

      # Separate step because it catches a different class of defect and the
      # failure should say which one. Two concurrency defects in tui/ were caught
      # only here.
      - name: test -race
        run: go test -race ./... -count=1

      # The suite is green far more often than the system works: of the seven
      # defects found in the first live-run round, four were invisible to it and
      # one was found only by the demo script. So CI runs the binary.
      #
      # --fake needs no credentials, no network and no money, and the rule is that
      # anything reachable with --fake stays reachable with --fake. This step is
      # what enforces it.
      - name: end-to-end (--fake, no credentials)
        run: |
          go build -o ./bin/quarry ./cmd/quarry
          ./bin/quarry run --fake --quiet --cap 0.25 --depth 2 \
            "What does it cost to run a GPU cluster for a year, how does that scale with utilisation, and what dominates the bill?"
          rec=$(ls -1 quarry-run-*.json | head -1)
          ./bin/quarry show "$rec"
          ./bin/quarry replay "$rec"

      # P8 is the load-bearing claim of the whole system: a record reproduces
      # byte-for-byte with no model access. The degenerate cases are where it
      # broke — a cap so small the root is priced out, and a deadline that gaps
      # every node — so both are asserted rather than assumed.
      #
      # EACH CASE ASSERTS THE SHAPE IT CLAIMS TO PRODUCE. The first version of this
      # step ran the deadline case against a single-clause statement, which the fake
      # planner declines to split: it produced one node and ZERO gaps, so the step
      # passed for 154ms without ever touching the time-truncation path it exists to
      # cover. A degenerate-case test that does not verify it reached the degenerate
      # case is the same class of lie as a green suite over a broken binary.
      - name: replay holds on the degenerate cases (P8)
        run: |
          set -e

          # shape <record> — prints "<gaps> <nodes>" from a record.
          shape() {
            python3 -c "
          import json,sys
          r=json.load(open(sys.argv[1]))
          o=r['Outcomes']
          gaps=sum(1 for x in o if x.get('Gap'))
          print(gaps, len(o))
          " "$1"
          }

          # Case 1 — SPEND: a cap below the floor prices out the root itself. No gaps at
          # all (only time is a gap, §3.1), which is exactly why this case was refused as
          # unreplayable once.
          rm -f quarry-run-*.json
          # A truncated run may exit non-zero by design (an empty answer is exit 1), so
          # the run's status is not the assertion — the replay and the shape are.
          ./bin/quarry run --fake --quiet --cap 0.000001 --depth 2 "Probe the spend floor." || true
          rec=$(ls -1 quarry-run-*.json 2>/dev/null | head -1)
          if [ -z "$rec" ]; then echo "no record written for the spend case"; exit 1; fi
          ./bin/quarry replay "$rec"

          # Case 2 — TIME: latency per call exceeds the whole deadline, so every node
          # gaps. The statement is multi-clause deliberately, because the fake planner
          # declines to split a short one and a single node cannot demonstrate a gapped
          # subtree. Robust on a slow runner: more pressure means more gaps, never fewer.
          rm -f quarry-run-*.json
          ./bin/quarry run --fake --quiet --cap 1.00 --deadline 300ms --fake-latency 400ms \
            --depth 2 "How much does storage cost, how does it scale, and what dominates the bill?" || true
          rec=$(ls -1 quarry-run-*.json 2>/dev/null | head -1)
          if [ -z "$rec" ]; then echo "no record written for the deadline case"; exit 1; fi
          read gaps nodes < <(shape "$rec")
          echo "deadline case: $gaps gaps of $nodes nodes"
          if [ "$gaps" -lt 1 ]; then
            echo "this case must produce at least one GAP or it is not testing time truncation"
            exit 1
          fi
          ./bin/quarry replay "$rec"

      # The host contract (#9). Two of its four decisions are about WHICH FILE
      # DESCRIPTOR bytes land on and WHAT THE PROCESS RETURNS, and no Go test can
      # reach either: `go test` calls exitCode() as a function and writes to a
      # buffer, so a summary printed to stdout under --events-json — which is a
      # parse error in a host's NDJSON — is invisible to the whole suite.
      #
      # bucktooth and rustynail vendor testdata/runevents and branch on these
      # numbers, so a regression here is a silent misread in two other repos rather
      # than a build error anywhere.
      - name: the host event stream is a contract (#9 D1/D2/D4)
        run: ./scripts/host-contract.sh ./bin/quarry

      # THE FOLD IS ALREADY PINNED by `go test` above: TestHostCorpus compares the
      # derived .ndjson and .expected.json byte-for-byte and fails without -update.
      # So this step deliberately does NOT re-assert that. It asserts the two things
      # a Go test cannot see, both of which are about the corpus being VENDORABLE:
      #
      #   1. every file is COMMITTED. An uncommitted fixture is not vendorable at all,
      #      and this is the likely mistake: `git add testdata/` is easy to forget on a
      #      directory the suite regenerates for you.
      #   2. `-update` never touches a RECORD. Records are captured by hand and are the
      #      one thing regeneration must not launder — two of the cases cannot be
      #      reproduced by any command (see testdata/runevents/README.md).
      #
      # THE FIRST DRAFT OF THIS STEP WAS VACUOUS and it took reintroducing a defect to
      # find out: it ran `-update` then `git diff`, but testdata/ was untracked, so
      # `git diff` reported nothing and the step passed with the fold changed under it.
      # A gate that under-reports is worse than no gate.
      - name: the vendored corpus is committed and its records are untouched
        run: |
          set -euo pipefail

          untracked=$(git ls-files --others --exclude-standard -- testdata/runevents)
          if [ -n "$untracked" ]; then
            echo "these corpus files are not committed, so nobody can vendor them:"
            echo "$untracked"
            exit 1
          fi
          n=$(git ls-files -- 'testdata/runevents/*.expected.json' | wc -l)
          if [ "$n" -lt 6 ]; then
            echo "found $n committed expectations; #9 requires the corpus, so this step"
            echo "must not pass on an empty or half-deleted directory"
            exit 1
          fi
          echo "$n cases committed"

          # Regeneration must be a no-op on a clean tree, and must not touch a record.
          go test . -run TestHostCorpus -update -count=1
          if ! git diff --exit-code --name-only -- testdata/runevents; then
            echo "regenerating changed committed files: either the wire changed — bump"
            echo "StreamVersion and tell bucktooth and rustynail — or this is an accident."
            exit 1
          fi
          records=$(git ls-files -- 'testdata/runevents/*.json' \
            | grep -v '\.expected\.json$')
          if ! git diff --exit-code --name-only -- $records; then
            echo "a RECORD changed. -update derives streams FROM records and must never"
            echo "write one: live-partition cost real money and the truncated cases are"
            echo "wall-clock races that would silently capture a different shape."
            exit 1
          fi

      - name: the demo runs end to end
        run: QUARRY_DEMO_NOPAUSE=1 ./demo.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      # .golangci.yml is a v2 config, so this needs a v2 golangci-lint whose own
      # Go build is at least the module's go directive. Pinned rather than
      # "latest", which has resolved to a v1.x binary that cannot parse it.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
